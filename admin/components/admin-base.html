<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urii Layout</title>
    <link rel="stylesheet" href="../css/admin-sidebar.css">
    <link rel="stylesheet" href="../css/admin-topbar.css">
    <style>
        html, body {
            margin: 0; padding: 0; height: 100%; overflow: hidden;
            background: #f4f5f8; font-family: 'Poppins', sans-serif;
        }
        .admin-layout {
            display: flex; height: 100vh;
        }
        .sidebar-col {
            width: 260px; flex-shrink: 0; height: 100vh;
            background: #FBF9F8; border-right: 1px solid rgba(0,0,0,0.03); overflow-y: auto;
        }
        .main-area {
            flex: 1; display: flex; flex-direction: column; height: 100vh;
        }
        .topbar-row {
            height: 64px; flex-shrink: 0; background: #fff;
            border-bottom: 1px solid rgba(0,0,0,0.03); display: flex; align-items: center;
            padding: 0 40px;
        }
        /* Nội dung chính chiếm phần còn lại, bên trên Footer */
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 30px 40px;
        }
        /* Vùng chứa Footer User ở dưới cùng */
        #user-footer-placeholder {
            flex-shrink: 0;
            width: 100%;
            background-color: #840001; /* Màu nền đỏ giống bên User */
        }
    </style>
</head>
<body>
<div class="admin-layout">
    <div class="sidebar-col" id="sidebar-container"></div>
    <div class="main-area">
        <div class="topbar-row" id="topbar-container"></div>
        
        <!-- Đã thay đổi cấu trúc: Content Area + Footer Area -->
        <div class="content-area" id="page-content-container">
            <!-- Nội dung các trang Admin sẽ được load vào đây -->
        </div>
        
        <!-- Vùng nhúng Footer User -->
        <div id="user-footer-placeholder"></div>
    </div>
</div>

<script>
    async function loadComponent(url, targetId) {
        const res = await fetch(url);
        if(res.ok) document.getElementById(targetId).innerHTML = await res.text();
    }
    
    // Load Sidebar và Topbar
    loadComponent('../components/admin-sidebar.html', 'sidebar-container');
    loadComponent('../components/admin-topbar.html', 'topbar-container');
    
    // Load Footer User
    loadComponent('../../user/components/footer.html', 'user-footer-placeholder');

    // Xử lý logout khi ở trong khung
    document.addEventListener('click', function(e) {
        if (e.target.closest('#adminLogoutBtn')) {
            e.preventDefault();
            if (confirm("Bạn có chắc muốn đăng xuất?")) {
                window.parent.location.href = "../../user/html/login.html";
            }
        }
    });
</script>

</body>
</html>
