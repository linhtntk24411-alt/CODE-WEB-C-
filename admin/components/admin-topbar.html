<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/admin-topbar.css">

<header class="admin-topbar">
    <div class="topbar-left">
        <div class="search-wrapper">
            <span class="material-symbols-outlined search-icon">search</span>
            <input class="search-input" placeholder="Tìm kiếm đơn hàng, người dùng..." type="text">
        </div>
    </div>

    <div class="topbar-right">
        <button type="button" class="icon-btn" title="Thông báo">
            <span class="material-symbols-outlined">notifications</span>
        </button>
        
        <button type="button" class="icon-btn" title="Cài đặt">
            <span class="material-symbols-outlined">settings</span>
        </button>
        
        <button type="button" class="icon-btn" title="Hộp thư">
            <span class="material-symbols-outlined">mail</span>
        </button>
        
        <div class="admin-profile">
            <div class="profile-avatar">
                <img src="../assets/avatar-non.jpg" alt="Urii Admin Avatar">
            </div>
            <span class="admin-name">Urii Admin</span>
        </div>
    </div>
</header>

<script src="../js/admin-layout.js"></script>
