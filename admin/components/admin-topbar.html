<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/admin-topbar.css">

<header class="admin-topbar">
    <div class="topbar-left">
        <button type="button" class="menu-toggle-btn" id="adminMenuToggleBtn" title="Menu">
            <span class="material-symbols-outlined">menu</span>
        </button>
        <div class="search-wrapper">
            <span class="material-symbols-outlined search-icon">search</span>
            <input class="search-input" placeholder="Tìm kiếm đơn hàng, người dùng..." type="text">
        </div>
    </div>

    <div class="topbar-right">
        <div class="notification-wrapper">
            <button type="button" class="icon-btn" id="adminNotificationBtn" title="Thông báo">
                <i class="bi bi-bell-fill fs-5"></i>
                <span class="notification-badge" id="notificationBadge" style="display: none;">0</span>
            </button>
            <div class="notification-dropdown" id="notificationDropdown">
                <div class="dropdown-header">
                    <span class="fw-bold">Thông báo mới</span>
                    <button class="btn-clear-all" id="btnClearNotifications">Đọc tất cả</button>
                </div>
                <div class="dropdown-body custom-scrollbar" id="notificationBody">
                    <!-- Sẽ được inject thông báo qua JS -->
                </div>
            </div>
        </div>
        
        <div class="admin-profile">
            <div class="profile-avatar">
                <img src="../assets/avatar-non.jpg" alt="Urii Admin Avatar">
            </div>
            <span class="admin-name">Urii Admin</span>
        </div>
    </div>
</header>
