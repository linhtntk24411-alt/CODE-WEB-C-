<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm mã giảm giá - Perler Beads Admin</title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <!-- CSS Admin -->
    <link rel="stylesheet" href="../css/admin-sidebar.css">
    <link rel="stylesheet" href="../css/admin-topbar.css">
    <link rel="stylesheet" href="../../user/css/footer.css">
    <link rel="stylesheet" href="../css/admin-coupon-form.css">
</head>
<body>

<div class="d-flex" style="height: 100vh; width: 100vw; overflow: hidden;">

    <!-- Sidebar -->
    <div class="flex-shrink-0" style="width: 300px; height: 100%; background-color: #FBF9F8; border-right: 1px solid rgba(0, 0, 0, 0.03); overflow-y: auto;" id="layout-sidebar"></div>

    <!-- Main Content -->
    <div class="flex-grow-1 d-flex flex-column" style="height: 100vh; overflow: hidden; background-color: #f4f5f8;">
        
        <!-- Topbar -->
        <div class="flex-shrink-0" style="height: 64px; background-color: #ffffff; border-bottom: 1px solid rgba(0, 0, 0, 0.03); display: flex; align-items: center; padding: 0 40px; width: 100%;" id="layout-topbar"></div>

        <!-- Content -->
        <div class="flex-grow-1" style="overflow-y: auto; padding: 30px 40px 40px 40px;">
            <div style="width: 100%; max-width: 900px; margin: 0 auto;">

                <!-- Page Header -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h1 class="fw-bold text-danger" style="font-family: 'Segoe UI', sans-serif; font-size: 28px;">
                            <i class="bi bi-plus-circle me-2"></i>Thêm mã giảm giá
                        </h1>
                        <p class="text-muted" style="font-size: 14px; font-family: 'Segoe UI', sans-serif;">
                            Tạo mã giảm giá mới cho hệ thống
                        </p>
                    </div>
                    <div>
                        <a href="admin-coupons.html" class="btn btn-outline-secondary" style="font-family: 'Segoe UI', sans-serif;">
                            <i class="bi bi-arrow-left me-1"></i> Quay lại
                        </a>
                    </div>
                </div>

                <!-- Alert Messages -->
                <div id="alert-message" class="alert d-none" role="alert" style="border-radius: 12px;">
                    <i class="bi me-2" id="alert-icon"></i>
                    <span id="alert-text"></span>
                </div>

                <!-- Form Card -->
                <div class="card border-0 shadow-sm rounded-4 bg-white">
                    <div class="card-body p-4">
                        <form id="couponForm" style="font-family: 'Segoe UI', sans-serif;">
                            
                            <!-- Row 1: Mã giảm giá + Phần trăm giảm -->
                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold" style="font-family: 'Segoe UI', sans-serif;">
                                        Mã giảm giá <span class="text-danger">*</span>
                                    </label>
                                    <input type="text" class="form-control" id="couponCode" placeholder="VD: URII2024" style="border-radius: 8px; padding: 12px 16px; font-family: 'Segoe UI', sans-serif;">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold" style="font-family: 'Segoe UI', sans-serif;">
                                        Phần trăm giảm (%) <span class="text-danger">*</span>
                                    </label>
                                    <input type="number" class="form-control" id="discountPercent" placeholder="VD: 15" min="0" max="100" style="border-radius: 8px; padding: 12px 16px; font-family: 'Segoe UI', sans-serif;">
                                </div>
                            </div>

                            <!-- Row 2: Điều kiện tối thiểu + Số lượng tối đa -->
                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold" style="font-family: 'Segoe UI', sans-serif;">
                                        Điều kiện áp dụng (VNĐ)
                                    </label>
                                    <input type="number" class="form-control" id="minOrder" placeholder="VD: 200000" style="border-radius: 8px; padding: 12px 16px; font-family: 'Segoe UI', sans-serif;">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold" style="font-family: 'Segoe UI', sans-serif;">
                                        Số lượng sử dụng tối đa
                                    </label>
                                    <input type="number" class="form-control" id="maxUses" placeholder="VD: 50" style="border-radius: 8px; padding: 12px 16px; font-family: 'Segoe UI', sans-serif;">
                                </div>
                            </div>

                            <!-- Row 3: Ngày bắt đầu + Ngày hết hạn -->
                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold" style="font-family: 'Segoe UI', sans-serif;">
                                        Ngày bắt đầu <span class="text-danger">*</span>
                                    </label>
                                    <input type="date" class="form-control" id="startDate" style="border-radius: 8px; padding: 12px 16px; font-family: 'Segoe UI', sans-serif;">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold" style="font-family: 'Segoe UI', sans-serif;">
                                        Ngày hết hạn <span class="text-danger">*</span>
                                    </label>
                                    <input type="date" class="form-control" id="endDate" style="border-radius: 8px; padding: 12px 16px; font-family: 'Segoe UI', sans-serif;">
                                </div>
                            </div>

                            <!-- Row 4: Trạng thái -->
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold" style="font-family: 'Segoe UI', sans-serif;">
                                        Trạng thái
                                    </label>
                                    <select class="form-select" id="status" style="border-radius: 8px; padding: 12px 16px; font-family: 'Segoe UI', sans-serif;">
                                        <option value="active">Đang hoạt động</option>
                                        <option value="inactive">Tạm ngưng</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Action Buttons -->
                            <div class="d-flex justify-content-end gap-3 pt-3 border-top">
                                <button type="button" class="btn btn-secondary" onclick="window.location.href='admin-coupons.html'" style="font-family: 'Segoe UI', sans-serif; padding: 10px 30px; border-radius: 8px;">
                                    <i class="bi bi-x-lg me-1"></i> Hủy
                                </button>
                                <button type="submit" class="btn btn-danger fw-bold" id="btnSave" style="font-family: 'Segoe UI', sans-serif; padding: 10px 30px; border-radius: 8px;">
                                    <i class="bi bi-save me-1"></i> Lưu mã giảm giá
                                </button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Layout Script -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        function loadComponent(url, targetId) {
            fetch(url)
                .then(response => {
                    if (!response.ok) throw new Error("Lỗi tải file: " + url);
                    return response.text();
                })
                .then(data => {
                    document.getElementById(targetId).innerHTML = data;
                    if(targetId === 'layout-sidebar') {
                        setTimeout(highlightActiveMenu, 100);
                    }
                })
                .catch(err => console.warn('Không thể tải layout:', err));
        }

        loadComponent('../components/admin-sidebar.html', 'layout-sidebar');
        loadComponent('../components/admin-topbar.html', 'layout-topbar');

        function highlightActiveMenu() {
            const currentPage = window.location.pathname.split('/').pop();
            const navLinks = document.querySelectorAll(".admin-sidebar .nav-item");
            navLinks.forEach(link => {
                const hrefAttribute = link.getAttribute("href");
                if (hrefAttribute && hrefAttribute.includes("admin-coupon")) {
                    navLinks.forEach(item => item.classList.remove("active"));
                    link.classList.add("active");
                }
            });
        }

        document.addEventListener('click', function(e) {
            if (e.target.closest('#adminLogoutBtn')) {
                e.preventDefault();
                if (confirm("Bạn có chắc muốn đăng xuất?")) {
                    window.location.href = "../../user/html/login.html";
                }
            }
        });

        // ── Set default date ──
        const today = new Date().toISOString().split('T')[0];
        const startDate = document.getElementById('startDate');
        const endDate = document.getElementById('endDate');
        if (startDate) startDate.value = today;
        if (endDate) {
            const future = new Date();
            future.setDate(future.getDate() + 30);
            endDate.value = future.toISOString().split('T')[0];
        }

        // ── Form Submit ──
        document.getElementById('couponForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const code = document.getElementById('couponCode').value.trim();
            const percent = document.getElementById('discountPercent').value.trim();
            const start = document.getElementById('startDate').value;
            const end = document.getElementById('endDate').value;
            
            const alertEl = document.getElementById('alert-message');
            const alertIcon = document.getElementById('alert-icon');
            const alertText = document.getElementById('alert-text');

            if (!code) {
                alertEl.className = 'alert alert-danger d-flex align-items-center';
                alertIcon.className = 'bi bi-exclamation-circle me-2';
                alertText.textContent = 'Vui lòng nhập mã giảm giá!';
                document.getElementById('couponCode').focus();
                return;
            }
            
            if (!percent || parseFloat(percent) <= 0 || parseFloat(percent) > 100) {
                alertEl.className = 'alert alert-danger d-flex align-items-center';
                alertIcon.className = 'bi bi-exclamation-circle me-2';
                alertText.textContent = 'Vui lòng nhập phần trăm giảm hợp lệ (1-100)!';
                document.getElementById('discountPercent').focus();
                return;
            }
            
            if (!start || !end) {
                alertEl.className = 'alert alert-danger d-flex align-items-center';
                alertIcon.className = 'bi bi-exclamation-circle me-2';
                alertText.textContent = 'Vui lòng chọn ngày bắt đầu và ngày hết hạn!';
                return;
            }

            // Hiển thị loading
            const btn = document.getElementById('btnSave');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Đang lưu...';
            btn.disabled = true;

            // Giả lập lưu thành công
            setTimeout(() => {
                alertEl.className = 'alert alert-success d-flex align-items-center';
                alertIcon.className = 'bi bi-check-circle me-2';
                alertText.textContent = `✅ Đã tạo mã giảm giá "${code}" thành công!`;
                
                btn.innerHTML = originalText;
                btn.disabled = false;
                
                // Reset form
                document.getElementById('couponForm').reset();
                if (startDate) startDate.value = today;
                if (endDate) {
                    const future = new Date();
                    future.setDate(future.getDate() + 30);
                    endDate.value = future.toISOString().split('T')[0];
                }

                // Ẩn alert sau 3 giây
                setTimeout(() => {
                    alertEl.className = 'alert d-none';
                }, 3000);
            }, 1500);
        });
    });
</script>
<!-- Đặt vị trí footer -->
<div id="footer-placeholder"></div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        fetch('../../user/components/footer.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
            })
            .catch(err => console.warn('Không thể tải footer:', err));
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
