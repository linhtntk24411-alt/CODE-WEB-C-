<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urii Admin | Thêm Sản Phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <link rel="stylesheet" href="../css/admin-product.css">
    <link rel="stylesheet" href="../css/admin-sidebar.css">
    <link rel="stylesheet" href="../css/admin-topbar.css">
</head>
<body>

<!-- 1. KHUNG NỘI DUNG CHÍNH (Giống y hệt Product) -->
<div class="admin-layout-wrapper">

    <div id="layout-sidebar"></div>
    <script>
        (function() {
            const cached = localStorage.getItem('cache_layout-sidebar');
            if (cached) {
                document.getElementById('layout-sidebar').innerHTML = cached;
                const currentPage = window.location.pathname.split('/').pop() || 'admin-dashboard.html';
                let matchPage = currentPage;
                if (matchPage.includes('admin-coupon')) matchPage = 'admin-coupons.html';
                if (matchPage.includes('admin-products-form')) matchPage = 'admin-products.html';
                const links = document.getElementById('layout-sidebar').querySelectorAll(".nav-item");
                links.forEach(link => {
                    const href = link.getAttribute("href");
                    if (href && href.includes(matchPage)) {
                        links.forEach(item => item.classList.remove("active"));
                        link.classList.add("active");
                    }
                });
            }
        })();
    </script>

    <div class="admin-main-area">
        
        <div id="layout-topbar"></div>
        <script>
            (function() {
                const cached = localStorage.getItem('cache_layout-topbar');
                if (cached) {
                    document.getElementById('layout-topbar').innerHTML = cached;
                }
            })();
        </script>

        <div class="admin-main-content" style="padding-top: 10px;">
            
            <div style="width: 100%; max-width: 700px; margin: 0 auto;">
            
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="fw-bold"><i class="bi bi-plus-circle-fill text-danger"></i> Thêm Sản Phẩm Mới</h2>
                    <a href="admin-products.html" class="btn btn-outline-danger fw-bold"><i class="bi bi-arrow-left"></i> Quay lại</a>
                </div>

                <div class="card border-0 shadow-sm rounded-4">
                    <div class="card-body p-4">
                        <form id="product-form">
                            <div class="mb-3">
                                <label for="prod-name" class="form-label fw-bold">Tên sản phẩm <span class="text-danger">*</span></label>
                                <input type="text" id="prod-name" class="form-control" placeholder="Nhập tên sản phẩm..." required>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="prod-category" class="form-label fw-bold">Danh mục <span class="text-danger">*</span></label>
                                     <select id="prod-category" class="form-select bg-light border-0" required>
                                         <option value="hat-nhua">Hạt nhựa</option>
                                         <option value="dung-cu">Dụng cụ</option>
                                         <option value="handmade">Handmade</option>
                                         <option value="kit">Bộ Kit</option>
                                         <option value="bead">Hạt nhựa</option>
                                         <option value="tool">Dụng cụ</option>
                                         <option value="accessory">Phụ kiện</option>
                                     </select>
                                </div>
                                <div class="col-md-6">
                                    <label for="prod-status" class="form-label fw-bold">Trạng thái</label>
                                    <select id="prod-status" class="form-select bg-light border-0">
                                        <option value="normal">Bình thường</option>
                                        <option value="new">Sản phẩm mới</option>
                                        <option value="hot">Sản phẩm Hot</option>
                                        <option value="sap-het">Sắp hết hàng</option>
                                        <option value="het-hang">Hết hàng</option>
                                    </select>
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="prod-price" class="form-label fw-bold">Giá bán (VNĐ) <span class="text-danger">*</span></label>
                                    <input type="number" id="prod-price" class="form-control" min="0" placeholder="0" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="prod-stock" class="form-label fw-bold">Số lượng kho <span class="text-danger">*</span></label>
                                    <input type="number" id="prod-stock" class="form-control" min="0" placeholder="0" required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="prod-image-file" class="form-label fw-bold">Hình ảnh sản phẩm <span class="text-danger">*</span></label>
                                <input type="file" id="prod-image-file" class="form-control" accept="image/*" >
                                <div class="mt-3">
                                    <img id="image-preview" src="#" alt="Xem trước" class="img-thumbnail d-none rounded-3" style="max-height: 150px;">
                                </div>
                            </div>

                            <hr class="my-4">
                            <div class="d-flex justify-content-end gap-2">
                                <button type="reset" class="btn btn-light fw-bold px-3 border">Xóa form</button>
                                <button type="submit" class="btn btn-danger px-4 fw-bold"><i class="bi bi-save"></i> Lưu sản phẩm</button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>

        </div> <!-- Hết vùng nội dung -->
    </div> <!-- Hết cột phải -->
</div> <!-- Hết khung chia cột -->

<!-- ===== SCRIPT NẠP LAYOUT ===== -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        function loadComponent(url, targetId) {
            const cacheKey = 'cache_' + targetId;
            const cachedData = localStorage.getItem(cacheKey);
            if (cachedData) {
                document.getElementById(targetId).innerHTML = cachedData;
                if (targetId === 'layout-sidebar') {
                    highlightActiveMenu();
                }
            }

            fetch(url)
                .then(response => {
                    if (!response.ok) throw new Error("Lỗi tải file: " + url);
                    return response.text();
                })
                .then(data => {
                    if (data !== cachedData) {
                        document.getElementById(targetId).innerHTML = data;
                        localStorage.setItem(cacheKey, data);
                        if (targetId === 'layout-sidebar') {
                            highlightActiveMenu();
                        }
                    }
                })
                .catch(err => console.warn('Không thể tải layout:', err));
        }

        loadComponent('../components/admin-sidebar.html', 'layout-sidebar');
        loadComponent('../components/admin-topbar.html', 'layout-topbar');

        function highlightActiveMenu() {
            const currentPage = window.location.pathname.split('/').pop();
            const navLinks = document.querySelectorAll(".admin-sidebar .nav-item");
            
            navLinks.forEach(link => {
                // Lấy đường dẫn href của từng nút menu
                const hrefAttribute = link.getAttribute("href");
                
                if (hrefAttribute) {
                    // Lấy tên file từ href (ví dụ: admin-products.html)
                    const linkPage = hrefAttribute.split('/').pop();
                    
                    // QUAN TRỌNG: Nếu đang ở form, coi như đang ở trang Products
                    if (currentPage === 'admin-products-form.html' && linkPage === 'admin-products.html') {
                        navLinks.forEach(item => item.classList.remove("active"));
                        link.classList.add("active");
                    }
                    // Logic cũ cho các trang bình thường
                    else if (hrefAttribute && hrefAttribute.includes(currentPage)) {
                        navLinks.forEach(item => item.classList.remove("active"));
                        link.classList.add("active");
                    }
                }
            });
        }

        
    });
</script>
<!-- Đặt vị trí footer -->
<div id="footer-placeholder"></div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        fetch('../../user/components/footer.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
            })
            .catch(err => console.warn('Không thể tải footer:', err));
    });
</script>

<script src="../js/admin-product-form.js"></script>
    <script src="../js/admin-layout.js"></script>
</body>
</html>
