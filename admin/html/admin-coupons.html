<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý mã giảm giá</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <link rel="stylesheet" href="../css/admin-sidebar.css">
    <link rel="stylesheet" href="../css/admin-topbar.css">
    <link rel="stylesheet" href="../../user/css/footer.css">
    <link rel="stylesheet" href="../css/admin-coupons.css">
</head>
<body>

<div class="admin-layout-wrapper">

    <div id="layout-sidebar"></div>

    <div class="admin-main-area">
        <div id="layout-topbar"></div>
        <div class="admin-main-content">
            <div style="width: 100%; max-width: 1400px; margin: 0 auto;">

                <!-- Page Heading & CTA: Chuyển sang trang form -->
                <div class="d-flex justify-content-end align-items-center mb-4">
                    <div>
                        <a href="admin-coupon-form.html" class="btn btn-danger fw-bold px-4 rounded-3" style="font-family: 'Nunito Sans', sans-serif;">
                            <i class="bi bi-plus-lg me-1"></i> Thêm mã giảm giá
                        </a>
                    </div>
                </div>

                <!-- Summary Cards -->
                <div class="row g-3 mb-4">
                    <div class="col-6 col-md-3">
                        <div class="card h-100 border-0 shadow-sm rounded-4 p-2 stat-card">
                            <div class="card-body d-flex align-items-center gap-3 p-3">
                                <div class="bg-primary bg-opacity-10 p-3 rounded-3 text-primary fs-4"><i class="bi bi-ticket"></i></div>
                                <div>
                                    <h6 class="text-muted small mb-1 fw-normal" style="font-family: 'Nunito Sans', sans-serif;">Tổng mã giảm giá</h6>
                                    <h3 class="fw-bold mb-0 text-dark" id="stat-total" style="font-family: 'Nunito Sans', sans-serif;">0</h3>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="card h-100 border-0 shadow-sm rounded-4 p-2 stat-card">
                            <div class="card-body d-flex align-items-center gap-3 p-3">
                                <div class="bg-success bg-opacity-10 p-3 rounded-3 text-success fs-4"><i class="bi bi-check-circle"></i></div>
                                <div>
                                    <h6 class="text-muted small mb-1 fw-normal" style="font-family: 'Nunito Sans', sans-serif;">Đang hoạt động</h6>
                                    <h3 class="fw-bold mb-0 text-dark" id="stat-active" style="font-family: 'Nunito Sans', sans-serif;">0</h3>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="card h-100 border-0 shadow-sm rounded-4 p-2 stat-card">
                            <div class="card-body d-flex align-items-center gap-3 p-3">
                                <div class="bg-warning bg-opacity-10 p-3 rounded-3 text-warning fs-4"><i class="bi bi-clock"></i></div>
                                <div>
                                    <h6 class="text-muted small mb-1 fw-normal" style="font-family: 'Nunito Sans', sans-serif;">Sắp hết hạn</h6>
                                    <h3 class="fw-bold mb-0 text-dark" id="stat-expiring" style="font-family: 'Nunito Sans', sans-serif;">0</h3>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="card h-100 border-0 shadow-sm rounded-4 p-2 stat-card">
                            <div class="card-body d-flex align-items-center gap-3 p-3">
                                <div class="bg-danger bg-opacity-10 p-3 rounded-3 text-danger fs-4"><i class="bi bi-x-circle"></i></div>
                                <div>
                                    <h6 class="text-muted small mb-1 fw-normal" style="font-family: 'Nunito Sans', sans-serif;">Đã hết hạn</h6>
                                    <h3 class="fw-bold mb-0 text-dark" id="stat-expired" style="font-family: 'Nunito Sans', sans-serif;">0</h3>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Filters -->
                <div class="card border-0 shadow-sm rounded-4 mb-4 p-3 filter-bar">
                    <div class="card-body p-0">
                        <div class="row g-2 align-items-end">
                            <div class="col-12 col-md-4">
                                <label class="filter-label">Tìm kiếm</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-search"></i></span>
                                    <input type="text" id="search-coupon" class="form-control" placeholder="Tìm mã hoặc điều kiện..." style="font-family: 'Nunito Sans', sans-serif;">
                                </div>
                            </div>
                            <div class="col-4 col-md-2">
                                <label class="filter-label">Trạng thái</label>
                                <select id="filter-status" class="form-select" style="font-family: 'Nunito Sans', sans-serif;">
                                    <option value="">Tất cả</option>
                                    <option value="active">Đang hoạt động</option>
                                    <option value="expiring">Sắp hết hạn</option>
                                    <option value="expired">Đã hết hạn</option>
                                </select>
                            </div>
                            <div class="col-4 col-md-2">
                                <label class="filter-label">Thời gian</label>
                                <select id="filter-time" class="form-select" style="font-family: 'Nunito Sans', sans-serif;">
                                    <option value="">Tất cả</option>
                                    <option value="7">7 ngày qua</option>
                                    <option value="30">Tháng này</option>
                                    <option value="90">Quý này</option>
                                </select>
                            </div>
                            <div class="col-4 col-md-2">
                                <label class="filter-label">Sắp xếp</label>
                                <select id="filter-sort" class="form-select" style="font-family: 'Nunito Sans', sans-serif;">
                                    <option value="newest">Mới nhất</option>
                                    <option value="oldest">Cũ nhất</option>
                                </select>
                            </div>
                            <div class="col-12 col-md-2">
                                <button class="btn btn-danger w-100 fw-bold" id="btn-filter" style="font-family: 'Nunito Sans', sans-serif; padding: 9px 0; border-radius: 8px; height: 42px;">
                                    <i class="bi bi-funnel me-1"></i> Lọc
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Coupon Table -->
                <div class="card border-0 shadow-sm rounded-4 bg-white">
                    <div class="card-header bg-transparent border-0 pt-4 px-4 pb-0">
                        <h4 class="fw-bold text-danger m-0" style="font-family: 'Nunito Sans', sans-serif;">Danh sách mã giảm giá</h4>
                        <small class="text-muted float-end" id="pagination-info">Hiển thị...</small>
                    </div>
                    <div class="table-responsive p-0 mt-2">
                        <table class="table table-hover align-middle mb-0 table-coupons">
                            <thead class="text-muted small fw-bold bg-light">
                                <tr>
                                    <th class="ps-4 py-3" style="font-family: 'Nunito Sans', sans-serif;">MÃ GIẢM GIÁ</th>
                                    <th class="py-3" style="font-family: 'Nunito Sans', sans-serif;">GIÁ TRỊ GIẢM</th>
                                    <th class="py-3" style="font-family: 'Nunito Sans', sans-serif;">ĐIỀU KIỆN ÁP DỤNG</th>
                                    <th class="py-3" style="font-family: 'Nunito Sans', sans-serif;">NGÀY TẠO</th>
                                    <th class="py-3" style="font-family: 'Nunito Sans', sans-serif;">NGÀY HẾT HẠN</th>
                                    <th class="py-3" style="font-family: 'Nunito Sans', sans-serif;">TRẠNG THÁI</th>
                                    <th class="pe-4 text-end py-3" style="font-family: 'Nunito Sans', sans-serif;">THAO TÁC</th>
                                </tr>
                            </thead>
                            <tbody id="coupon-list" class="fs-6"></tbody>
                        </table>
                    </div>
                    <div class="card-footer bg-white border-top border-light py-3 px-4 d-flex justify-content-between align-items-center flex-wrap">
                        <nav>
                            <ul class="pagination pagination-sm m-0" id="pagination-controls"></ul>
                        </nav>
                    </div>
                </div>

            </div>
        </div>

    </div>
</div>

<!-- 2. FOOTER NẰM Ở NGOÀI CÙNG -->
<div id="footer-placeholder"></div>

<!-- Layout Script -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        function loadComponent(url, targetId) {
            fetch(url)
                .then(response => {
                    if (!response.ok) throw new Error("Lỗi tải file: " + url);
                    return response.text();
                })
                .then(data => {
                    document.getElementById(targetId).innerHTML = data;
                    if(targetId === 'layout-sidebar') {
                        setTimeout(highlightActiveMenu, 100);
                    }
                })
                .catch(err => console.warn('Không thể tải layout:', err));
        }

        loadComponent('../components/admin-sidebar.html', 'layout-sidebar');
        loadComponent('../components/admin-topbar.html', 'layout-topbar');

        function highlightActiveMenu() {
            const currentPage = window.location.pathname.split('/').pop();
            const navLinks = document.querySelectorAll(".admin-sidebar .nav-item");
            navLinks.forEach(link => {
                const hrefAttribute = link.getAttribute("href");
                if (hrefAttribute && hrefAttribute.includes("admin-coupons")) {
                    navLinks.forEach(item => item.classList.remove("active"));
                    link.classList.add("active");
                }
            });
        }

        document.addEventListener('click', function(e) {
            if (e.target.closest('#adminLogoutBtn')) {
                e.preventDefault();
                if (confirm("Bạn có chắc muốn đăng xuất?")) {
                    window.location.href = "../../user/html/login.html";
                }
            }
        });
    });
</script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        fetch('../../user/components/footer.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
            })
            .catch(err => console.warn('Không thể tải footer:', err));
    });
</script>

<script src="../js/admin-coupons.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
