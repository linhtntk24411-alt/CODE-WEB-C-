<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Người dùng - Perler Beads</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <link rel="stylesheet" href="../css/admin-sidebar.css">
    <link rel="stylesheet" href="../css/admin-topbar.css">
    <link rel="stylesheet" href="../../user/css/footer.css">
    <link rel="stylesheet" href="../css/admin-users.css">
</head>
<body>

<div class="d-flex" style="height: 100vh; width: 100vw; overflow: hidden;">

    <!-- 1. SIDEBAR -->
    <div class="flex-shrink-0" style="width: 300px; height: 100%; background-color: #FBF9F8; border-right: 1px solid rgba(0, 0, 0, 0.03); overflow-y: auto;" id="layout-sidebar"></div>

    <!-- 2. MAIN AREA -->
    <div class="flex-grow-1 d-flex flex-column" style="height: 100vh; overflow: hidden; background-color: #f4f5f8;">
        
        <!-- TOPBAR -->
        <div class="flex-shrink-0" style="height: 64px; background-color: #ffffff; border-bottom: 1px solid rgba(0, 0, 0, 0.03); display: flex; align-items: center; padding: 0 40px; width: 100%;" id="layout-topbar"></div>

        <!-- CONTENT -->
        <div class="flex-grow-1" style="overflow-y: auto; padding: 30px 40px 40px 40px; display: flex; justify-content: center; align-items: flex-start;">
            
            <div style="width: 100%; max-width: 1400px;">

                <!-- ========== PAGE HEADER ========== -->
                <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
                    <div>
                        <h1 class="fw-bold mb-1" style="font-size: 28px;">Quản lý người dùng</h1>
                        <p class="text-muted small m-0">Xem và quản lý danh sách khách hàng, thành viên trên hệ thống Urii.</p>
                    </div>
                </div>

                <!-- ========== STATS CARDS ========== -->
                <div class="row g-3 mb-4">
                    <div class="col-6 col-md-3">
                        <div class="card h-100 border-0 shadow-sm rounded-4 p-2">
                            <div class="card-body d-flex align-items-center gap-3 p-3">
                                <div class="bg-primary bg-opacity-10 p-3 rounded-3 text-primary fs-4"><i class="bi bi-people"></i></div>
                                <div><h6 class="text-muted small mb-1 fw-normal">Tổng người dùng</h6><h3 class="fw-bold mb-0 text-primary" id="stat-total">0</h3></div>
                            </div>
                        </div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="card h-100 border-0 shadow-sm rounded-4 p-2">
                            <div class="card-body d-flex align-items-center gap-3 p-3">
                                <div class="bg-success bg-opacity-10 p-3 rounded-3 text-success fs-4"><i class="bi bi-person-plus"></i></div>
                                <div><h6 class="text-muted small mb-1 fw-normal">Thành viên mới</h6><h3 class="fw-bold mb-0 text-success" id="stat-new">0</h3></div>
                            </div>
                        </div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="card h-100 border-0 shadow-sm rounded-4 p-2">
                            <div class="card-body d-flex align-items-center gap-3 p-3">
                                <div class="bg-danger bg-opacity-10 p-3 rounded-3 text-danger fs-4"><i class="bi bi-lightning"></i></div>
                                <div><h6 class="text-muted small mb-1 fw-normal">Đang hoạt động</h6><h3 class="fw-bold mb-0 text-danger" id="stat-active">0</h3></div>
                            </div>
                        </div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="card h-100 border-0 shadow-sm rounded-4 p-2">
                            <div class="card-body d-flex align-items-center gap-3 p-3">
                                <div class="bg-secondary bg-opacity-10 p-3 rounded-3 text-secondary fs-4"><i class="bi bi-person-fill-slash"></i></div>
                                <div><h6 class="text-muted small mb-1 fw-normal">Bị khóa</h6><h3 class="fw-bold mb-0 text-secondary" id="stat-locked">0</h3></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ========== FILTER BAR ========== -->
                <div class="card border-0 shadow-sm rounded-4 mb-4 p-3">
                    <div class="card-body p-0">
                        <div class="row g-3 align-items-center">
                            <div class="col-md-3">
                                <select id="filter-role" class="form-select bg-light border-0">
                                    <option value="">Tất cả vai trò</option>
                                    <option value="admin">Quản trị viên</option>
                                    <option value="customer">Khách hàng</option>
                                    <option value="member_bronze">Thành viên Đồng</option>
                                    <option value="member_silver">Thành viên Bạc</option>
                                    <option value="member_gold">Thành viên Vàng</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <select id="filter-status" class="form-select bg-light border-0">
                                    <option value="">Tất cả trạng thái</option>
                                    <option value="active">Đang hoạt động</option>
                                    <option value="pending_verify">Chờ xác minh</option>
                                    <option value="locked">Bị khóa</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-funnel"></i></span>
                                    <input type="text" id="filter-advanced" class="form-control border-start-0 bg-light border-0" placeholder="Bộ lọc nâng cao">
                                </div>
                            </div>
                            <div class="col-md-3">
                                <select id="filter-sort" class="form-select bg-light border-0">
                                    <option value="newest">Mới nhất</option>
                                    <option value="oldest">Cũ nhất</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ========== USER TABLE ========== -->
                <div class="card border-0 shadow-sm rounded-4 bg-white">
                    <div class="card-body p-0">
                        <div class="table-responsive p-0">
                            <table class="table table-hover align-middle mb-0 table-users">
                                <thead class="text-muted small fw-bold bg-light">
                                    <tr>
                                        <th class="ps-4 py-3">Họ và tên</th>
                                        <th class="py-3">Email</th>
                                        <th class="py-3">SĐT</th>
                                        <th class="py-3">Ngày đăng ký</th>
                                        <th class="py-3">Vai trò</th>
                                        <th class="py-3">Trạng thái</th>
                                        <th class="pe-4 text-end py-3">Thao tác</th>
                                    </tr>
                                </thead>
                                <tbody id="users-list" class="fs-6">
                                    <!-- Render bởi JS -->
                                </tbody>
                            </table>
                        </div>
                        <div class="card-footer bg-white border-top border-light py-3 px-4 d-flex justify-content-between align-items-center flex-wrap">
                            <div class="text-muted small" id="pagination-info">Hiển thị...</div>
                            <nav>
                                <ul class="pagination pagination-sm m-0" id="pagination-controls"></ul>
                            </nav>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<!-- SCRIPTS NẠP LAYOUT -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        function loadComponent(url, targetId) {
            fetch(url)
                .then(response => {
                    if (!response.ok) throw new Error("Lỗi tải file: " + url);
                    return response.text();
                })
                .then(data => {
                    document.getElementById(targetId).innerHTML = data;
                    if(targetId === 'layout-sidebar') {
                        setTimeout(highlightActiveMenu, 100);
                    }
                })
                .catch(err => console.warn('Không thể tải layout:', err));
        }

        loadComponent('../components/admin-sidebar.html', 'layout-sidebar');
        loadComponent('../components/admin-topbar.html', 'layout-topbar');

        function highlightActiveMenu() {
            const currentPage = window.location.pathname.split('/').pop();
            const navLinks = document.querySelectorAll(".admin-sidebar .nav-item");
            navLinks.forEach(link => {
                const hrefAttribute = link.getAttribute("href");
                if (hrefAttribute && hrefAttribute.includes(currentPage)) {
                    navLinks.forEach(item => item.classList.remove("active"));
                    link.classList.add("active");
                }
            });
        }

        document.addEventListener('click', function(e) {
            if (e.target.closest('#adminLogoutBtn')) {
                e.preventDefault();
                if (confirm("Bạn có chắc muốn đăng xuất?")) {
                    window.location.href = "../../user/html/login.html";
                }
            }
        });
    });
</script>
<!-- Đặt vị trí footer -->
<div id="footer-placeholder"></div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        fetch('../../user/components/footer.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
            })
            .catch(err => console.warn('Không thể tải footer:', err));
    });
</script>

<script src="../js/admin-users.js"></script>
<!-- QUAN TRỌNG: Đã thêm Bootstrap JS để Dropdown hoạt động -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
