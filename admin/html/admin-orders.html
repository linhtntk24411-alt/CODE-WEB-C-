<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Đơn hàng - Perler Beads</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <!-- Load các file CSS layout chung -->
    <link rel="stylesheet" href="../css/admin-sidebar.css">
    <link rel="stylesheet" href="../css/admin-topbar.css">
    <!-- CSS riêng cho trang Đơn hàng -->
    <link rel="stylesheet" href="../css/admin-orders.css">
</head>
<body>

<!-- 1. KHUNG LAYOUT CHIA 2 CỘT (Flexbox) (Giống y hệt trang Product) -->
<div class="d-flex" style="height: 100vh; width: 100vw; overflow: hidden;">

    <!-- 1.1 CỘT SIDEBAR BÊN TRÁI -->
    <div class="flex-shrink-0" style="width: 300px; height: 100%; background-color: #FBF9F8; border-right: 1px solid rgba(0, 0, 0, 0.03); overflow-y: auto;" id="layout-sidebar"></div>

    <!-- 1.2 CỘT BÊN PHẢI (Topbar + Nội dung) -->
    <div class="flex-grow-1 d-flex flex-column" style="height: 100vh; overflow: hidden; background-color: #f4f5f8;">
        
        <!-- 1.2.1 TOPBAR TRÊN CÙNG -->
        <div class="flex-shrink-0" style="height: 64px; background-color: #ffffff; border-bottom: 1px solid rgba(0, 0, 0, 0.03); display: flex; align-items: center; padding: 0 40px; width: 100%;" id="layout-topbar"></div>

        <!-- 1.2.2 NỘI DUNG DƯỚI CÙNG (Đã thêm justify-content: center để căn giữa) -->
        <div class="flex-grow-1" style="overflow-y: auto; padding: 30px 40px 40px 40px; display: flex; justify-content: center; align-items: flex-start;">
            
            <!-- Wrapper chứa nội dung chính để căn giữa -->
            <div style="width: 100%; max-width: 1400px;">
                
                <!-- =========== STATS CARDS (4 Cái) =========== -->
                <div class="row g-3 mb-4">
                    <!-- Tổng đơn hàng -->
                    <div class="col-6 col-md-3">
                        <div class="card h-100 border-0 shadow-sm rounded-4 p-2">
                            <div class="card-body d-flex align-items-center gap-3 p-3">
                                <div class="bg-primary bg-opacity-10 p-3 rounded-3 text-primary fs-4"><i class="bi bi-clipboard-data"></i></div>
                                <div><h6 class="text-muted small mb-1 fw-normal">Tổng đơn hàng</h6><h3 class="fw-bold mb-0 text-dark" id="stat-total">0</h3></div>
                            </div>
                        </div>
                    </div>
                    <!-- Chờ xác nhận -->
                    <div class="col-6 col-md-3">
                        <div class="card h-100 border-0 shadow-sm rounded-4 p-2">
                            <div class="card-body d-flex align-items-center gap-3 p-3">
                                <div class="bg-warning bg-opacity-10 p-3 rounded-3 text-warning fs-4"><i class="bi bi-hourglass-split"></i></div>
                                <div><h6 class="text-muted small mb-1 fw-normal">Chờ xác nhận</h6><h3 class="fw-bold mb-0 text-warning" id="stat-pending">0</h3></div>
                            </div>
                        </div>
                    </div>
                    <!-- Đã xác nhận -->
                    <div class="col-6 col-md-3">
                        <div class="card h-100 border-0 shadow-sm rounded-4 p-2">
                            <div class="card-body d-flex align-items-center gap-3 p-3">
                                <div class="bg-success bg-opacity-10 p-3 rounded-3 text-success fs-4"><i class="bi bi-check-circle"></i></div>
                                <div><h6 class="text-muted small mb-1 fw-normal">Đã xác nhận</h6><h3 class="fw-bold mb-0 text-success" id="stat-approved">0</h3></div>
                            </div>
                        </div>
                    </div>
                    <!-- Yêu cầu hủy -->
                    <div class="col-6 col-md-3">
                        <div class="card h-100 border-0 shadow-sm rounded-4 p-2">
                            <div class="card-body d-flex align-items-center gap-3 p-3">
                                <div class="bg-danger bg-opacity-10 p-3 rounded-3 text-danger fs-4"><i class="bi bi-x-circle"></i></div>
                                <div><h6 class="text-muted small mb-1 fw-normal">Yêu cầu hủy</h6><h3 class="fw-bold mb-0 text-danger" id="stat-cancel">0</h3></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- =========== FILTER BAR =========== -->
                <div class="card border-0 shadow-sm rounded-4 mb-4 p-3">
                    <div class="card-body p-0">
                        <div class="row g-3 align-items-center">
                            <div class="col-md-3">
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-search"></i></span>
                                    <input type="text" id="search-name" class="form-control border-start-0 ps-0" placeholder="Mã đơn hàng hoặc tên khách...">
                                </div>
                            </div>
                            <div class="col-md-2">
                                <select id="filter-status" class="form-select bg-light border-0">
                                    <option value="">Trạng thái</option>
                                    <option value="pending">Chờ xác nhận</option>
                                    <option value="approved">Đã xác nhận</option>
                                    <option value="completed">Hoàn thành</option>
                                    <option value="cancelled">Đã hủy</option>
                                </select>
                            </div>
                            <div class="col-md-2">
                                <input type="date" id="filter-date" class="form-control bg-light border-0">
                            </div>
                            <div class="col-md-2">
                                <select id="filter-sort" class="form-select bg-light border-0">
                                    <option value="">Sắp xếp theo</option>
                                    <option value="newest">Mới nhất</option>
                                    <option value="oldest">Cũ nhất</option>
                                </select>
                            </div>
                            <div class="col-md-auto">
                                <button class="btn btn-danger w-100 fw-bold px-4" id="btn-filter">
                                    <i class="bi bi-funnel me-1"></i> Lọc
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- =========== DANH SÁCH ĐƠN HÀNG =========== -->
                <div class="card border-0 shadow-sm rounded-4 bg-white mb-5">
                    <div class="card-header bg-transparent border-0 pt-4 px-4 pb-0">
                        <h4 class="fw-bold text-danger m-0">Danh sách đơn hàng</h4>
                        <small class="text-muted float-end" id="pagination-info">Hiển thị 1-10 của 0 đơn</small>
                    </div>
                    <div class="table-responsive p-0 mt-2">
                        <table class="table table-hover align-middle mb-0 table-orders">
                            <thead class="text-muted small fw-bold bg-light">
                                <tr>
                                    <th class="ps-4 py-3">MÃ ĐƠN HÀNG</th>
                                    <th class="py-3">KHÁCH HÀNG</th>
                                    <th class="py-3">NGÀY ĐẶT</th>
                                    <th class="py-3">SẢN PHẨM</th>
                                    <th class="py-3">TỔNG TIỀN</th>
                                    <th class="py-3">TRẠNG THÁI</th>
                                    <th class="pe-4 text-end py-3">THAO TÁC</th>
                                </tr>
                            </thead>
                            <tbody id="order-list" class="fs-6"></tbody>
                        </table>
                    </div>
                    <div class="card-footer bg-white border-top border-light py-3 px-4 d-flex justify-content-between align-items-center flex-wrap">
                        <nav>
                            <ul class="pagination pagination-sm m-0" id="pagination-controls"></ul>
                        </nav>
                    </div>
                </div>

                <!-- =========== YÊU CẦU HỦY ĐƠN HÀNG =========== -->
                <div class="card border-0 shadow-sm rounded-4 bg-white">
                    <div class="card-header bg-transparent border-0 pt-4 px-4 pb-0 d-flex justify-content-between align-items-center">
                        <h4 class="fw-bold text-danger m-0">Yêu cầu hủy đơn hàng <span class="badge bg-danger rounded-pill fs-6 align-middle">8 mới</span></h4>
                    </div>
                    <div class="table-responsive p-0 mt-2">
                        <table class="table table-hover align-middle mb-0 table-orders-cancel">
                            <thead class="text-muted small fw-bold bg-light">
                                <tr>
                                    <th class="ps-4 py-3">MÃ ĐƠN HÀNG</th>
                                    <th class="py-3">KHÁCH HÀNG</th>
                                    <th class="py-3">LÝ DO HỦY</th>
                                    <th class="py-3">NGÀY YÊU CẦU</th>
                                    <th class="py-3">TRẠNG THÁI</th>
                                    <th class="pe-4 text-end py-3">XỬ LÝ</th>
                                </tr>
                            </thead>
                            <tbody id="cancel-list" class="fs-6"></tbody>
                        </table>
                    </div>
                    <div class="card-footer bg-white border-top border-light py-3 px-4 d-flex justify-content-between align-items-center flex-wrap">
                        <nav>
                            <ul class="pagination pagination-sm m-0" id="pagination-controls-cancel"></ul>
                        </nav>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<!-- SCRIPT NẠP LAYOUT VÀ ACTIVE MENU -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        function loadComponent(url, targetId) {
            fetch(url)
                .then(response => {
                    if (!response.ok) throw new Error("Lỗi tải file: " + url);
                    return response.text();
                })
                .then(data => {
                    document.getElementById(targetId).innerHTML = data;
                    if(targetId === 'layout-sidebar') {
                        setTimeout(highlightActiveMenu, 100);
                    }
                })
                .catch(err => console.warn('Không thể tải layout:', err));
        }

        loadComponent('../components/admin-sidebar.html', 'layout-sidebar');
        loadComponent('../components/admin-topbar.html', 'layout-topbar');

        function highlightActiveMenu() {
            const currentPage = window.location.pathname.split('/').pop();
            const navLinks = document.querySelectorAll(".admin-sidebar .nav-item");
            navLinks.forEach(link => {
                const hrefAttribute = link.getAttribute("href");
                if (hrefAttribute && hrefAttribute.includes(currentPage)) {
                    navLinks.forEach(item => item.classList.remove("active"));
                    link.classList.add("active");
                }
            });
        }

        document.addEventListener('click', function(e) {
            if (e.target.closest('#adminLogoutBtn')) {
                e.preventDefault();
                if (confirm("Bạn có chắc muốn đăng xuất?")) {
                    window.location.href = "../../user/html/login.html";
                }
            }
        });
    });
</script>

<!-- JS CỦA TRANG ĐƠN HÀNG -->
<script src="../js/admin-orders.js"></script>
</body>
</html>
