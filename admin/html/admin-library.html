<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Map Mẫu - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <link rel="stylesheet" href="../css/admin-sidebar.css">
    <link rel="stylesheet" href="../css/admin-topbar.css">
    <link rel="stylesheet" href="../../user/css/footer.css">
    <link rel="stylesheet" href="../css/admin-library.css">
</head>
<body>

<div class="d-flex" style="height: 100vh; width: 100vw; overflow: hidden;">

    <div class="flex-shrink-0" style="width: 300px; height: 100%; background-color: #FBF9F8; border-right: 1px solid rgba(0, 0, 0, 0.03); overflow-y: auto;" id="layout-sidebar"></div>

    <div class="flex-grow-1 d-flex flex-column" style="height: 100vh; overflow: hidden; background-color: #f4f5f8;">
        
        <div class="flex-shrink-0" style="height: 64px; background-color: #ffffff; border-bottom: 1px solid rgba(0, 0, 0, 0.03); display: flex; align-items: center; padding: 0 40px; width: 100%;" id="layout-topbar"></div>

        <div class="flex-grow-1" style="overflow-y: auto; padding: 30px 40px 40px 40px; display: flex; justify-content: center; align-items: flex-start;">
            
            <div style="width: 100%; max-width: 1400px;">
                
                <!-- HEADER -->
                <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
                    <div>
                        <h1 class="fw-bold mb-1" style="font-size: 28px;">📚 Quản lý Map mẫu</h1>
                        <p class="text-muted small m-0">Quản lý danh sách mẫu thiết kế hạt ủi (Perler Beads) trong hệ thống.</p>
                    </div>
                    <button class="btn btn-danger fw-bold px-4 py-2 rounded-3 shadow-sm" id="btn-add-map">
                        <i class="bi bi-plus-circle me-1"></i> Thêm mẫu mới
                    </button>
                </div>

                <!-- BẢNG DANH SÁCH MAP MẪU -->
                <div class="card border-0 shadow-sm rounded-4 bg-white">
                    <div class="card-body p-0">
                        <div class="table-responsive p-0">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="bg-light text-muted" style="font-size: 13px; font-weight: 600;">
                                    <tr>
                                        <th class="ps-4 py-3" style="width: 80px;">Ảnh mẫu</th>
                                        <th class="py-3">Tên mẫu</th>
                                        <th class="py-3">Tác giả</th>
                                        <th class="py-3">Đánh giá</th>
                                        <th class="pe-4 text-end py-3" style="width: 120px;">Hành động</th>
                                    </tr>
                                </thead>
                                <tbody id="map-list" class="fs-6"></tbody>
                            </table>
                        </div>
                        <div class="card-footer bg-white border-top border-light py-3 px-4 d-flex justify-content-between align-items-center flex-wrap">
                            <div class="text-muted small" id="pagination-info">Hiển thị...</div>
                            <nav>
                                <ul class="pagination pagination-sm m-0" id="pagination-controls"></ul>
                            </nav>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<!-- ========== MODAL THÊM / SỬA MẪU ========== -->
<div class="modal fade" id="mapModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold text-danger" id="modalTitle">Thêm mẫu mới</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="mapForm">
                    <input type="hidden" id="edit-id">
                    
                    <div class="mb-3">
                        <label for="map-name" class="form-label fw-bold">Tên mẫu <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="map-name" placeholder="Ví dụ: Mèo Chibi Pastel" required>
                    </div>
                    <div class="mb-3">
                        <label for="map-author" class="form-label fw-bold">Tác giả <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="map-author" placeholder="Tên tác giả" required>
                    </div>
                    <div class="mb-3">
                        <label for="map-image" class="form-label fw-bold">URL Ảnh mẫu</label>
                        <input type="text" class="form-control" id="map-image" placeholder="https://...">
                        <div class="mt-2">
                            <img id="image-preview" src="#" class="img-thumbnail d-none" style="max-height: 120px;">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="map-rating" class="form-label fw-bold">Đánh giá (0 - 5)</label>
                        <input type="number" class="form-control" id="map-rating" min="0" max="5" step="0.1" value="4.5">
                    </div>
                    <div class="mb-3">
                        <label for="map-desc" class="form-label fw-bold">Mô tả</label>
                        <textarea class="form-control" id="map-desc" rows="3" placeholder="Mô tả ngắn về mẫu thiết kế..."></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                <button type="button" class="btn btn-danger fw-bold px-4" id="btn-save-map"><i class="bi bi-save"></i> Lưu mẫu</button>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        function loadComponent(url, targetId) {
            fetch(url)
                .then(response => {
                    if (!response.ok) throw new Error("Lỗi tải file: " + url);
                    return response.text();
                })
                .then(data => {
                    document.getElementById(targetId).innerHTML = data;
                    if(targetId === 'layout-sidebar') {
                        setTimeout(highlightActiveMenu, 100);
                    }
                })
                .catch(err => console.warn('Không thể tải layout:', err));
        }

        loadComponent('../components/admin-sidebar.html', 'layout-sidebar');
        loadComponent('../components/admin-topbar.html', 'layout-topbar');

        function highlightActiveMenu() {
            const currentPage = window.location.pathname.split('/').pop();
            const navLinks = document.querySelectorAll(".admin-sidebar .nav-item");
            navLinks.forEach(link => {
                const hrefAttribute = link.getAttribute("href");
                if (hrefAttribute && hrefAttribute.includes(currentPage)) {
                    navLinks.forEach(item => item.classList.remove("active"));
                    link.classList.add("active");
                }
            });
        }

        document.addEventListener('click', function(e) {
            if (e.target.closest('#adminLogoutBtn')) {
                e.preventDefault();
                if (confirm("Bạn có chắc muốn đăng xuất?")) {
                    window.location.href = "../../user/html/login.html";
                }
            }
        });
    });
</script>
<!-- Đặt vị trí footer -->
<div id="footer-placeholder"></div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        fetch('../../user/components/footer.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
            })
            .catch(err => console.warn('Không thể tải footer:', err));
    });
</script>

<script src="../js/admin-library.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
