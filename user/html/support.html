<!DOCTYPE html>
<html class="light" lang="vi">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Hỗ trợ khách hàng | Urii Perler Beads</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet" />

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <!-- CSS hệ thống -->
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/component.css" />
  <link rel="stylesheet" href="../css/header.css" />
  <link rel="stylesheet" href="../css/profile.css" />
  <link rel="stylesheet" href="../css/support.css" />
</head>
<body>

  <!-- HEADER -->
  <div id="header-placeholder"></div>

  <!-- MAIN -->
  <main class="profile-main">
    <div class="profile-container">
      <!-- Sidebar Navigation -->
      <aside class="profile-sidebar">
        <nav class="profile-nav">
          <a class="profile-nav-item active" data-tab="support-center" href="#">
            <i class="bi bi-question-circle-fill"></i>
            Trung tâm hỗ trợ
          </a>
          <a class="profile-nav-item" data-tab="faq" href="#">
            <i class="bi bi-question-lg"></i>
            Câu hỏi thường gặp
          </a>
          <a class="profile-nav-item" data-tab="privacy-policy" href="#">
            <i class="bi bi-shield-lock-fill"></i>
            Chính sách bảo mật
          </a>
          <a class="profile-nav-item" data-tab="terms-of-service" href="#">
            <i class="bi bi-file-text-fill"></i>
            Điều khoản sử dụng
          </a>
          <div class="profile-nav-divider"></div>
          <a class="profile-nav-item" href="index.html">
            <i class="bi bi-arrow-left"></i>
            Quay lại trang chủ
          </a>
        </nav>
      </aside>

      <!-- Content Area -->
      <div class="profile-content">
        <div id="supportContent">
          <!-- Render từ support.json -->
        </div>
      </div>
    </div>
  </main>

  <!-- FOOTER & CHATBOT -->
  <div id="footer-placeholder"></div>
  <div id="chatbot-placeholder"></div>

  <!-- JS -->
  <script src="../js/main.js"></script>
  <script src="../js/header.js"></script>
  <script src="../js/support.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      fetch('../components/header.html')
        .then(res => res.text())
        .then(data => document.getElementById('header-placeholder').innerHTML = data)
        .catch(() => console.warn('Header not found'));

      fetch('../components/footer.html')
        .then(res => res.text())
        .then(data => document.getElementById('footer-placeholder').innerHTML = data)
        .catch(() => console.warn('Footer not found'));
    });
  </script>
</body>
</html>
