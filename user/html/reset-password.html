<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urii | Thiết Lập Mật Khẩu Mới</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <!-- CSS hệ thống -->
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/component.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="../css/header.css">
  <link rel="stylesheet" href="../css/reset-password.css">
</head>
<body class="auth-page">
  <!-- HEADER -->
  <div id="header-placeholder"></div>

  <!-- MAIN CONTENT -->
  <main class="auth-main">
    <div class="auth-bg-decoration auth-bg-decoration--top"></div>
    <div class="auth-bg-decoration auth-bg-decoration--bottom"></div>

    <div class="auth-card reset-card">
      <div class="auth-header">
        <h2 class="auth-title">Thiết lập mật khẩu mới</h2>
        <p class="auth-subtitle">Vui lòng nhập mật khẩu mới để tiếp tục truy cập vào tài khoản của bạn.</p>
      </div>

      <form class="auth-form" id="resetPasswordForm" novalidate>
        <!-- Mật khẩu mới -->
        <div class="input-group">
          <label for="new-password" class="input-label">Mật khẩu mới</label>
          <div class="password-input-wrapper">
            <input type="password" id="new-password" class="input-field" placeholder="Nhập mật khẩu mới" required>
            <button type="button" class="password-toggle" data-target="new-password">
              <span class="material-symbols-outlined">visibility</span>
            </button>
          </div>
          <div class="password-requirements" id="passwordRequirements">
            <span class="req-item" data-req="length">
              <span class="req-circle"></span> Ít nhất 8 ký tự
            </span>
            <span class="req-item" data-req="uppercase">
              <span class="req-circle"></span> Chữ hoa (A-Z)
            </span>
            <span class="req-item" data-req="lowercase">
              <span class="req-circle"></span> Chữ thường (a-z)
            </span>
            <span class="req-item" data-req="number">
              <span class="req-circle"></span> Số (0-9)
            </span>
          </div>
        </div>

        <!-- Xác nhận mật khẩu -->
        <div class="input-group">
          <label for="confirm-password" class="input-label">Xác nhận mật khẩu mới</label>
          <div class="password-input-wrapper">
            <input type="password" id="confirm-password" class="input-field" placeholder="Xác nhận lại mật khẩu" required>
            <button type="button" class="password-toggle" data-target="confirm-password">
              <span class="material-symbols-outlined">visibility</span>
            </button>
          </div>
          <div class="password-match-feedback" id="passwordMatchFeedback"></div>
        </div>

        <button type="submit" class="auth-btn">Cập nhật mật khẩu</button>
      </form>

      <!-- Quay lại login -->
      <div class="reset-back-link">
        <a href="login.html" class="reset-back-link__anchor">
          <span class="material-symbols-outlined">arrow_back</span>
          Quay lại Đăng nhập
        </a>
      </div>
    </div>
  </main>

  <!-- FOOTER & CHATBOT -->
  <div id="footer-placeholder"></div>
  <div id="chatbot-placeholder"></div>

  <!-- JS -->
  <script src="../js/main.js"></script>
  <script src="../js/header.js"></script>
  <script src="../js/reset-password.js"></script>

  <!-- FETCH HEADER / FOOTER -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      fetch('../components/header.html')
        .then(res => res.text())
        .then(data => document.getElementById('header-placeholder').innerHTML = data)
        .catch(() => console.warn('Header not found'));

      fetch('../components/footer.html')
        .then(res => res.text())
        .then(data => document.getElementById('footer-placeholder').innerHTML = data)
        .catch(() => console.warn('Footer not found'));
    });
  </script>
</body>
</html>
