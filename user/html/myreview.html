<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đánh giá của tôi | Urii Perler Beads</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/myreview.css">
</head>
<body>
    <!-- HEADER -->
    <div id="header-placeholder"></div>

    <!-- MAIN CONTENT -->
    <main class="py-4">
        <div class="container">
            <div class="row g-4">
                <!-- Sidebar -->
                <div class="col-lg-3">
                    <div class="sidebar-wrapper">
                        <nav class="sidebar-nav">
                            <a href="profile.html" class="sidebar-nav-item">
                                <span class="material-symbols-outlined">person</span>
                                Hồ sơ của tôi
                            </a>
                            <a href="orders.html" class="sidebar-nav-item">
                                <span class="material-symbols-outlined">shopping_bag</span>
                                Đơn hàng của tôi
                            </a>
                            <a href="custom-order-list.html" class="sidebar-nav-item">
                                <span class="material-symbols-outlined">edit_square</span>
                                Yêu cầu thiết kế
                            </a>
                            <a href="saved-maps.html" class="sidebar-nav-item">
                                <span class="material-symbols-outlined">grid_view</span>
                                Kho map đã lưu
                            </a>
                            <a href="myreview.html" class="sidebar-nav-item active">
                                <span class="material-symbols-outlined">grade</span>
                                Đánh giá của tôi
                            </a>
                            <div class="sidebar-nav-divider"></div>
                            <a href="logout.html" class="sidebar-nav-item sidebar-nav-item--logout" id="logoutTrigger">
                                <span class="material-symbols-outlined">logout</span>
                                Đăng xuất
                            </a>
                        </nav>
                    </div>
                </div>

                <!-- Content -->
                <div class="col-lg-9">
                    <!-- Header -->
                    <div class="d-flex flex-wrap align-items-center justify-content-between mb-4">
                        <div>
                            <h1 class="font-Segoe UI fw-bold" style="font-size: 28px; color: var(--on-surface);">Đánh giá của tôi</h1>
                            <p class="text-secondary" style="font-size: 14px;">Quản lý và xem lại các đánh giá bạn đã viết.</p>
                        </div>
                        <div class="d-flex align-items-center gap-3">
                            <span class="text-secondary" style="font-size: 14px;">
                                Tổng cộng: <strong id="totalReviews">3 đánh giá</strong>
                            </span>
                        </div>
                    </div>

                    <!-- Reviews List -->
                    <div class="d-flex flex-column gap-3" id="reviewsContainer">
                        <!-- Reviews will be rendered by JavaScript -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <div id="footer-placeholder"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"> </script>
    <script src="../js/main.js"></script>
    <script src="../js/header.js"></script>
    <script src="../js/myreview.js"></script>
</body>
</html>
