<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Urii - Sản phẩm</title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- CSS riêng -->
    <link rel="stylesheet" href="../css/product.css">
</head>
<body>

<main class="container py-4 py-lg-5">
    <!-- Breadcrumb -->
    <nav aria-label="Breadcrumb" class="mb-4">
        <ol class="breadcrumb small mb-2">
            <li class="breadcrumb-item"><a href="#" class="text-decoration-none text-secondary">Trang chủ</a></li>
            <li class="breadcrumb-item active text-primary-urii fw-bold" aria-current="page">Sản phẩm</li>
        </ol>
        <h1 class="display-6 fw-bold" style="font-family: 'Poppins', sans-serif;">Tất cả sản phẩm</h1>
    </nav>

    <div class="row g-4">
        <!-- Sidebar Filter -->
        <div class="col-lg-3">
            <div class="filter-sidebar">
                <h2 class="filter-title">Bộ lọc</h2>

                <!-- Price Filter -->
                <div class="filter-group">
                    <label>Khoảng giá (VNĐ)</label>
                    <div class="form-check">
                        <input class="form-check-input price-filter" type="checkbox" value="under50" id="price1">
                        <label class="form-check-label" for="price1">Dưới 50.000</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input price-filter" type="checkbox" value="50-200" id="price2">
                        <label class="form-check-label" for="price2">50.000 - 200.000</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input price-filter" type="checkbox" value="200-500" id="price3">
                        <label class="form-check-label" for="price3">200.000 - 500.000</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input price-filter" type="checkbox" value="over500" id="price4">
                        <label class="form-check-label" for="price4">Trên 500.000</label>
                    </div>
                </div>

                <!-- Color Filter -->
                <div class="filter-group">
                    <label>Màu sắc</label>
                    <div class="d-flex flex-wrap gap-2" id="colorFilter">
                        <button class="color-btn" style="background: #dc3545;" data-color="red" title="Đỏ"></button>
                        <button class="color-btn" style="background: #0d6efd;" data-color="blue" title="Xanh dương"></button>
                        <button class="color-btn" style="background: #ffc107;" data-color="yellow" title="Vàng"></button>
                        <button class="color-btn" style="background: #198754;" data-color="green" title="Xanh lá"></button>
                        <button class="color-btn" style="background: #d63384;" data-color="pink" title="Hồng"></button>
                        <button class="color-btn" style="background: #6f42c1;" data-color="purple" title="Tím"></button>
                        <button class="color-btn" style="background: #fd7e14;" data-color="orange" title="Cam"></button>
                        <button class="color-btn" style="background: #f8f9fa; border-color: #dee2e6;" data-color="white" title="Trắng"></button>
                        <button class="color-btn" style="background: #212529;" data-color="black" title="Đen"></button>
                        <button class="color-btn" style="background: #6c757d;" data-color="gray" title="Xám"></button>
                    </div>
                </div>

                <button id="clearFilters" class="btn btn-outline-secondary w-100 mt-3">
                    <i class="bi bi-x-circle me-1"></i>Xóa tất cả bộ lọc
                </button>
            </div>
        </div>

        <!-- Product Grid -->
        <div class="col-lg-9">
            <!-- Search & Sort -->
            <div class="sort-bar">
                <div class="d-flex flex-wrap align-items-center gap-2">
                    <p class="info-text mb-0" id="infoText">Hiển thị <strong id="startCount">1</strong>-<strong id="endCount">10</strong> trong số <strong id="totalCount">0</strong> sản phẩm</p>
                </div>
                <div class="d-flex flex-wrap align-items-center gap-2">
                    <div class="search-wrapper" style="flex: 1; min-width: 180px;">
                        <i class="bi bi-search"></i>
                        <input type="text" id="searchInput" class="search-input" placeholder="Tìm kiếm sản phẩm...">
                    </div>
                    <select id="sortSelect" class="form-select form-select-sm" style="width: auto; min-width: 150px; border-radius: 0.75rem;">
                        <option value="popular">Phổ biến nhất</option>
                        <option value="price-asc">Giá tăng dần</option>
                        <option value="price-desc">Giá giảm dần</option>
                        <option value="name-asc">Tên A → Z</option>
                        <option value="name-desc">Tên Z → A</option>
                    </select>
                </div>
            </div>

            <!-- Product Grid -->
            <div id="productGrid" class="product-grid" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1.5rem;">
                <!-- Products will be rendered here -->
            </div>

            <!-- Pagination -->
            <nav aria-label="Phân trang" class="mt-4" id="paginationContainer">
                <ul class="pagination justify-content-center" id="pagination">
                    <!-- Pagination will be rendered here -->
                </ul>
            </nav>
        </div>
    </div>
</main>

<!-- JavaScript -->
<script src="../js/product.js"></script>
</body>
</html>
