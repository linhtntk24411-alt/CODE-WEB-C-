<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách sản phẩm</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/product.css">
    <script src="../js/product.js" defer></script>
</head>
<body>
    <div id="header-component"></div>

    <!-- Main Content -->
    <main class="container my-4">
        <!-- Breadcrumb -->
        <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb small mb-0 bg-white p-2 px-3 rounded-3 shadow-sm">
                <li class="breadcrumb-item"><a href="index.html" class="text-decoration-none text-secondary">Trang chủ</a></li>
                <li class="breadcrumb-item active text-primary-custom fw-bold" aria-current="page">Sản phẩm</li>
            </ol>
        </nav>

        <div class="row g-4">
            <!-- Sidebar Filter -->
            <aside class="col-lg-3">
                <div class="bg-white rounded-4 p-4 shadow-sm sticky-top product-filter-panel" style="top: 20px;">
                    <h5 class="fw-bold text-primary-custom mb-4"><i class="bi bi-funnel"></i> Bộ lọc</h5>

                    <!-- Price Filter -->
                    <div class="mb-4">
                        <label class="fw-semibold small text-secondary d-block mb-2">Khoảng giá (VNĐ)</label>
                        <div class="form-check">
                            <input class="form-check-input filter-price" type="checkbox" value="under-50" id="price1">
                            <label class="form-check-label small" for="price1">Dưới 50.000</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input filter-price" type="checkbox" value="50-200" id="price2">
                            <label class="form-check-label small" for="price2">50.000 - 200.000</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input filter-price" type="checkbox" value="over-200" id="price3">
                            <label class="form-check-label small" for="price3">Trên 200.000</label>
                        </div>
                    </div>

                    <!-- Sale Filter -->
                    <div class="mb-4">
                        <label class="fw-semibold small text-secondary d-block mb-2">Khuyến mãi</label>
                        <div class="form-check">
                            <input class="form-check-input filter-sale" type="checkbox" value="sale" id="sale1">
                            <label class="form-check-label small" for="sale1">Đang giảm giá</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input filter-sale" type="checkbox" value="hot" id="sale2">
                            <label class="form-check-label small" for="sale2">Sản phẩm hot</label>
                        </div>
                    </div>

                    <!-- Rating Filter - Dạng cột với 5 khoảng: 4.5+, 4.0+, 3.5+, 3.0+, <3.0 -->
                    <div class="mb-4">
                        <label class="fw-semibold small text-secondary d-block mb-2">Đánh giá</label>
                        <div class="rating-filter-group">
                            <button class="rating-filter-btn active" data-rating="all">
                                <i class="bi bi-list-ul"></i> Tất cả
                            </button>
                            <button class="rating-filter-btn" data-rating="4.5">
                                <span class="stars">★★★★★</span> 4.5+
                            </button>
                            <button class="rating-filter-btn" data-rating="4.0">
                                <span class="stars">★★★★</span> 4.0+
                            </button>
                            <button class="rating-filter-btn" data-rating="3.5">
                                <span class="stars">★★★☆</span> 3.5+
                            </button>
                            <button class="rating-filter-btn" data-rating="3.0">
                                <span class="stars">★★★</span> 3.0+
                            </button>
                            <button class="rating-filter-btn" data-rating="below-3">
                                <span class="stars">★★☆</span> Dưới 3.0
                            </button>
                        </div>
                    </div>

                    <button class="btn btn-outline-secondary w-100 rounded-pill py-2" id="clearFilters">
                        <i class="bi bi-arrow-counterclockwise"></i> Xóa bộ lọc
                    </button>
                </div>
            </aside>

            <!-- Product Grid -->
            <div class="col-lg-9">
                <!-- Sorting Bar -->
                <div class="d-flex flex-wrap align-items-center justify-content-between bg-white p-3 rounded-4 shadow-sm mb-4">
                    <p class="small text-secondary mb-0" id="productCount">Đang tải...</p>
                    <div class="d-flex align-items-center gap-3">
                        <label class="d-none d-md-inline small text-secondary mb-0">Sắp xếp:</label>
                        <select class="form-select form-select-sm bg-white border-0 shadow-sm" id="sortSelect" style="width: auto; border-radius: 8px;">
                            <option value="popular">Phổ biến nhất</option>
                            <option value="price-asc">Giá: Thấp đến Cao</option>
                            <option value="price-desc">Giá: Cao đến Thấp</option>
                            <option value="sale">Giảm giá nhiều nhất</option>
                        </select>
                    </div>
                </div>

                <div id="categoryInfo" class="alert alert-light border rounded-3 py-2 px-3 mb-4 small text-secondary"></div>

                <!-- Product List -->
                <div id="content" class="product-list">
                    <div class="loading-spinner">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                </div>

                <!-- Pagination -->
                <nav aria-label="Page navigation" class="mt-4">
                    <ul class="pagination justify-content-center" id="paginationContainer">
                        <!-- Pagination sẽ được tạo động -->
                    </ul>
                </nav>
            </div>
        </div>
    </main>

    <div id="footer-component"></div>

    <script src="../js/global.js"></script>
</body>
</html>
