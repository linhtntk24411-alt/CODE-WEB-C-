<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chi tiết đơn hàng | Urii Perler Beads</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet" />

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <!-- CSS hệ thống -->
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/component.css" />
  <link rel="stylesheet" href="../css/header.css" />
  <link rel="stylesheet" href="../css/order-detail.css" />
</head>
<body>

  <!-- HEADER -->
  <div id="header-placeholder"></div>

  <main class="order-detail-main">
    <div class="order-detail-container">

      <!-- Breadcrumb -->
      <nav class="order-detail-breadcrumb">
        <a href="profile.html">Hồ sơ của tôi</a>
        <span class="separator">&gt;</span>
        <a href="orders.html">Đơn hàng của tôi</a>
        <span class="separator">&gt;</span>
        <span id="orderIdDisplay">Chi tiết đơn hàng</span>
      </nav>

      <!-- Nội dung chính -->
      <div class="order-detail-wrapper">
        <!-- Left: Thông tin chính -->
        <div class="order-detail-left">

          <!-- Header đơn hàng -->
          <div class="order-header">
            <div>
              <h1 class="order-title" id="orderTitle">Đơn hàng #UR-82941</h1>
              <p class="order-date" id="orderDate">Ngày đặt: 20/05/2024 14:30</p>
            </div>
            <span class="order-status-badge" id="orderStatusBadge">Đang xử lý</span>
          </div>

          <!-- Timeline (Stepper) -->
          <div class="order-timeline-wrapper">
            <h3 class="timeline-title">
              <i class="bi bi-clock-history"></i> Tiến trình xử lý
            </h3>
            <div class="order-timeline" id="orderTimeline">
              <!-- Render từ JS -->
            </div>
          </div>

          <!-- Shipping Timeline -->
          <div class="order-shipping-timeline">
            <h2 class="section-title"><i class="bi bi-truck"></i> Lịch trình vận chuyển</h2>
            <div id="shippingTimeline"></div>
          </div>

          <!-- Thông tin sản phẩm -->
          <div class="order-products">
            <h2 class="section-title"><i class="bi bi-box"></i> Sản phẩm</h2>
            <div id="orderItems"></div>
          </div>

          <!-- Thông tin thanh toán -->
          <div class="order-payment">
            <h2 class="section-title"><i class="bi bi-credit-card"></i> Phương thức thanh toán</h2>
            <div id="orderPayment"></div>
          </div>
        </div>

        <!-- Right: Thông tin vận chuyển + địa chỉ -->
        <div class="order-detail-right">
          <div class="order-shipping">
            <h2 class="section-title"><i class="bi bi-truck"></i> Thông tin vận chuyển</h2>
            <div id="orderShipping"></div>
          </div>

          <div class="order-address">
            <h2 class="section-title"><i class="bi bi-geo-alt"></i> Địa chỉ nhận hàng</h2>
            <div id="orderAddress"></div>
          </div>

          <div class="order-summary">
            <h2 class="section-title"><i class="bi bi-receipt"></i> Tổng kết đơn hàng</h2>
            <div id="orderSummary"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- FOOTER & CHATBOT -->
  <div id="footer-placeholder"></div>
  <div id="chatbot-placeholder"></div>

  <!-- JS -->
  <script src="../js/main.js"></script>
  <script src="../js/header.js"></script>
  <script src="../js/order-detail.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      fetch('../components/header.html')
        .then(res => res.text())
        .then(data => document.getElementById('header-placeholder').innerHTML = data)
        .catch(() => console.warn('Header not found'));

      fetch('../components/footer.html')
        .then(res => res.text())
        .then(data => document.getElementById('footer-placeholder').innerHTML = data)
        .catch(() => console.warn('Footer not found'));
    });
  </script>
  
</body>
</html>
