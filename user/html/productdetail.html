<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết sản phẩm - Urii Perler Beads</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/productdetail.css">
    <script src="../js/productdetail.js" defer></script>
    <script src="../js/header.js" defer></script>
    <script src="../js/main.js" defer></script>
</head>
<body>
     <div id="header-placeholder"></div>
    <!-- Main Content -->
    <div class="container py-4">
        <!-- Breadcrumb -->
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb small mb-0 bg-white p-2 px-3 rounded-3 shadow-sm">
                <li class="breadcrumb-item"><a href="index.html" class="text-decoration-none text-secondary">Trang chủ</a></li>
                <li class="breadcrumb-item"><a href="product.html" class="text-decoration-none text-secondary">Sản phẩm</a></li>
                <li class="breadcrumb-item active text-primary-custom fw-bold" aria-current="page" id="breadcrumbProduct">Đang tải...</li>
            </ol>
        </nav>

        <!-- Loading Spinner -->
        <div id="loadingSpinner" class="loading-spinner">
            <div class="spinner-border text-primary-custom" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <!-- Product Detail -->
        <div id="productDetail" style="display: none;">
            <div class="row g-4">
                <!-- Gallery -->
                <div class="col-lg-5">
                    <div class="bg-white rounded-4 p-3 shadow-sm">
                        <div class="product-main-image mb-3">
                            <img id="mainImage" src="" alt="Product">
                        </div>
                        <div class="d-flex gap-2 overflow-auto pb-2" id="thumbnailContainer"></div>
                    </div>
                </div>

                <!-- Product Info -->
                <div class="col-lg-7">
                    <div class="bg-white rounded-4 p-4 shadow-sm">
                        <h1 class="fw-bold fs-3 mb-2" id="productName" style="font-family: 'Poppins', sans-serif;">Đang tải...</h1>
                        
                        <div class="d-flex align-items-center gap-3 mb-3">
                            <div class="stars-display" id="productStars"></div>
                            <span class="text-secondary small fw-semibold" id="productRating">0 (0 đánh giá)</span>
                            <span class="text-secondary small">|</span>
                            <span class="text-secondary small" id="productSold">Đã bán 0</span>
                        </div>

                        <div class="bg-light p-3 rounded-3 mb-3">
                            <span class="fs-2 fw-bold text-danger" id="currentPrice">0₫</span>
                            <span class="text-decoration-line-through text-secondary ms-2" id="originalPrice"></span>
                            <span class="badge bg-danger bg-opacity-10 text-danger ms-2 py-2 px-3" id="discountBadge"></span>
                        </div>
                        <div id="saleCountdownWrap" class="mb-3"></div>

                        <!-- Variants -->
                        <div class="mb-3" id="variantSection">
                            <label class="fw-semibold small text-secondary d-block mb-2">Phân loại sản phẩm</label>
                            <div class="d-flex flex-wrap gap-2" id="variantContainer"></div>
                        </div>

                        <!-- Quantity -->
                        <div class="mb-3">
                            <label class="fw-semibold small text-secondary d-block mb-2">Số lượng</label>
                            <div class="d-flex align-items-center gap-3">
                                <div class="d-flex align-items-center">
                                    <button class="qty-btn rounded-start" id="qtyMinus" onclick="updateQuantity(-1)">-</button>
                                    <input type="number" class="qty-input" id="qtyInput" value="1" min="1" onchange="validateQuantity()">
                                    <button class="qty-btn rounded-end" id="qtyPlus" onclick="updateQuantity(1)">+</button>
                                </div>
                                <span class="text-secondary small" id="stockInfo">0 sản phẩm có sẵn</span>
                            </div>
                        </div>

                        <!-- Actions -->
                        <div class="d-flex flex-column flex-sm-row gap-2 mt-4">
                            <button class="btn btn-outline-primary-custom flex-fill py-3 rounded-pill fw-semibold" onclick="addCurrentProductToCart()">
                                <i class="bi bi-cart-plus me-2"></i>Thêm vào giỏ hàng
                            </button>
                            <button class="btn btn-primary-custom flex-fill py-3 rounded-pill fw-semibold" onclick="buyCurrentProductNow()">
                                <i class="bi bi-bag me-2"></i>Mua ngay
                            </button>
                        </div>

                        <!-- Features -->
                        <div class="row g-2 mt-3">
                            <div class="col-6">
                                <div class="d-flex align-items-center gap-2 text-secondary small">
                                    <i class="bi bi-truck text-danger"></i>
                                    <span>Giao hàng toàn quốc</span>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="d-flex align-items-center gap-2 text-secondary small">
                                    <i class="bi bi-shield-check text-danger"></i>
                                    <span>Hàng chính hãng 100%</span>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="d-flex align-items-center gap-2 text-secondary small">
                                    <i class="bi bi-arrow-repeat text-danger"></i>
                                    <span>Đổi trả trong 7 ngày</span>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="d-flex align-items-center gap-2 text-secondary small">
                                    <i class="bi bi-gift text-danger"></i>
                                    <span>Tặng kèm map mẫu</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tabs -->
            <div class="mt-4">
                <div class="bg-white rounded-4 shadow-sm overflow-hidden">
                    <ul class="nav nav-tabs-custom border-bottom px-4 pt-2" id="productTabs" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="desc-tab" data-bs-toggle="tab" data-bs-target="#description" type="button" role="tab">
                                <i class="bi bi-file-text me-2"></i>Mô tả sản phẩm
                            </button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="reviews-tab" data-bs-toggle="tab" data-bs-target="#reviews" type="button" role="tab">
                                <i class="bi bi-star me-2"></i>Đánh giá (<span id="reviewCount">0</span>)
                            </button>
                        </li>
                    </ul>

                    <div class="tab-content p-4">
                        <!-- Description -->
                        <div class="tab-pane fade show active" id="description" role="tabpanel">
                            <div id="productDescription" class="text-secondary" style="font-size: 16px; line-height: 1.8;"></div>
                        </div>

                        <!-- Reviews -->
                        <div class="tab-pane fade" id="reviews" role="tabpanel">
                            <div id="reviewsContent"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Related Products -->
            <section class="mt-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="fw-bold mb-0" style="font-family: 'Poppins', sans-serif;">Sản phẩm gợi ý</h4>
                    <div class="d-flex gap-2">
                        <button class="btn btn-sm btn-outline-secondary rounded-circle" onclick="scrollRelated(-1)">
                            <i class="bi bi-chevron-left"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-secondary rounded-circle" onclick="scrollRelated(1)">
                            <i class="bi bi-chevron-right"></i>
                        </button>
                    </div>
                </div>
                
                <!-- Related products categories filter -->
                <div class="d-flex flex-wrap gap-2 mb-3" id="relatedCategories">
                    <button class="category-filter-btn active" data-category="all" onclick="filterRelated('all', this)">Tất cả</button>
                    <button class="category-filter-btn" data-category="kit" onclick="filterRelated('kit', this)">Bộ KIT</button>
                    <button class="category-filter-btn" data-category="bead" onclick="filterRelated('bead', this)">Hạt lẻ</button>
                    <button class="category-filter-btn" data-category="tool" onclick="filterRelated('tool', this)">Dụng cụ</button>
                    <button class="category-filter-btn" data-category="accessory" onclick="filterRelated('accessory', this)">Phụ kiện</button>
                </div>

                <div class="related-scroll" id="relatedProducts">
                    <!-- Related products will be loaded dynamically -->
                </div>
            </section>
        </div>
    </div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            fetch('../components/header.html')
                .then(res => res.text())
                .then(data => document.getElementById('header-placeholder').innerHTML = data)
                .catch(() => console.warn('Header not found'));

            fetch('../components/footer.html')
                .then(res => res.text())
                .then(data => document.getElementById('footer-placeholder').innerHTML = data)
                .catch(() => console.warn('Footer not found'));
        });
    </script>
    <div id="footer-placeholder"></div>
</body>
</html>
