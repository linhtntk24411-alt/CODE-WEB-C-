<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký | Urii</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <!-- CSS hệ thống -->
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/component.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="auth-page">
  <!-- HEADER -->
  <div id="header-placeholder"></div>

  <!-- MAIN CONTENT -->
  <main class="auth-main auth-main--register">
    <div class="auth-bg-decoration auth-bg-decoration--top"></div>
    <div class="auth-bg-decoration auth-bg-decoration--bottom"></div>

    <div class="auth-card auth-card--register">
      <div class="auth-header">
        <h2 class="auth-title auth-title--primary">Tạo tài khoản mới</h2>
        <p class="auth-subtitle">Tham gia cộng đồng Urii Perler Beads ngay hôm nay</p>
      </div>

      <!-- Toggle Tabs -->
      <div class="toggle-tabs" role="tablist">
        <a href="login.html" class="toggle-tab toggle-tab--link" role="tab">Đăng nhập</a>
        <button class="toggle-tab active" id="register-tab" role="tab" aria-selected="true">Đăng ký</button>
      </div>

      <!-- Form Đăng ký -->
      <form class="auth-form" id="register-form" novalidate>
        <div class="input-group input-group--register">
          <label for="fullname" class="input-label input-label--register">Họ và tên</label>
          <input type="text" id="fullname" class="input-field" placeholder="Nguyễn Văn A" required>
        </div>
        <div class="input-group input-group--register">
          <label for="email" class="input-label input-label--register">Email</label>
          <input type="email" id="email" class="input-field" placeholder="example@email.com" required>
        </div>
        <div class="input-group input-group--register">
          <label for="password" class="input-label input-label--register">Mật khẩu</label>
          <input type="password" id="password" class="input-field" placeholder="••••••••" required>
        </div>
        <div class="input-group input-group--register">
          <label for="confirm-password" class="input-label input-label--register">Xác nhận mật khẩu</label>
          <input type="password" id="confirm-password" class="input-field" placeholder="••••••••" required>
        </div>
        <button type="submit" class="auth-btn">Đăng ký</button>
      </form>

      <div class="divider divider--register">
        <span class="divider-line"></span>
        <span class="divider-text divider-text--register">Hoặc đăng ký bằng</span>
        <span class="divider-line"></span>
      </div>

      <!-- Social Logins -->
      <div class="social-logins">
        <!-- Google -->
        <button class="social-btn social-btn--google">
          <svg viewBox="0 0 24 24" width="20" height="20">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 12-4.53z" fill="#EA4335"/>
          </svg>
          Google
        </button>
        <!-- Facebook -->
        <button class="social-btn social-btn--facebook">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="#1877F2">
            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
          </svg>
          Facebook
        </button>
      </div>

      <p class="auth-help auth-help--register">
        Bạn đã có tài khoản? <a href="login.html" class="auth-help-link">Đăng nhập ngay</a>
      </p>
    </div>
  </main>

  <!-- FOOTER & CHATBOT -->
  <div id="footer-placeholder"></div>
  <div id="chatbot-placeholder"></div>

  <!-- JS -->
  <script src="../js/main.js"></script>
  <script>
    (function() {
      const form = document.getElementById('register-form');
      if (form) {
        form.addEventListener('submit', function(e) {
          e.preventDefault();
          const btn = form.querySelector('.auth-btn');
          const originalText = btn.textContent;
          btn.textContent = 'Đang xử lý...';
          btn.disabled = true;
          btn.classList.add('loading');

          const password = document.getElementById('password');
          const confirm = document.getElementById('confirm-password');
          if (password.value !== confirm.value) {
            alert('Mật khẩu xác nhận không khớp!');
            btn.textContent = originalText;
            btn.disabled = false;
            btn.classList.remove('loading');
            return;
          }

          setTimeout(() => {
            btn.textContent = originalText;
            btn.disabled = false;
            btn.classList.remove('loading');
            alert('Đăng ký thành công! (Demo)');
            // window.location.href = 'login.html';
          }, 1500);
        });
      }
    })();
  </script>
</body>
</html>
