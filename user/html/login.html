<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập | Urii</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <!-- CSS hệ thống -->
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/component.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="../css/header.css">
</head>
<body class="auth-page">
  <!-- HEADER PLACEHOLDER -->
  <div id="header-placeholder"></div>

  <!-- MAIN CONTENT -->
  <main class="auth-main">
    <div class="auth-bg-decoration auth-bg-decoration--top"></div>
    <div class="auth-bg-decoration auth-bg-decoration--bottom"></div>

    <div class="auth-card">
      <div class="auth-header">
        <h2 class="auth-title" id="auth-title">Chào mừng trở lại</h2>
        <p class="auth-subtitle" id="auth-subtitle">Vui lòng đăng nhập để tiếp tục sáng tạo cùng Urii.</p>
      </div>

      <!-- Toggle Tabs -->
      <div class="toggle-tabs" role="tablist">
        <button class="toggle-tab active" id="login-tab" role="tab" aria-selected="true">Đăng nhập</button>
        <a href="register.html" class="toggle-tab toggle-tab--link" role="tab">Đăng ký</a>
      </div>

      <!-- Form Đăng nhập -->
      <form class="auth-form" id="auth-form" novalidate>
        <div class="input-group">
          <label for="email" class="input-label">Email</label>
          <input type="email" id="email" class="input-field" placeholder="example@gmail.com" required>
        </div>
        <div class="input-group">
          <div class="input-label-row">
            <label for="password" class="input-label">Mật khẩu</label>
            <a href="#" class="forgot-link" id="forgotPasswordLink">Quên mật khẩu?</a>
          </div>
          <div class="password-input-wrapper">
            <input type="password" id="password" class="input-field" placeholder="••••••••" required>
            <button type="button" class="password-toggle" data-target="password" aria-label="Hiện mật khẩu">
              <span class="material-symbols-outlined">visibility</span>
            </button>
          </div>
        </div>
        <button type="submit" class="auth-btn">Tiếp tục</button>
      </form>

      <div class="divider">
        <span class="divider-line"></span>
        <span class="divider-text">HOẶC</span>
        <span class="divider-line"></span>
      </div>

      <!-- Social Logins -->
      <div class="social-logins">
        <button class="social-btn social-btn--google">
          <svg viewBox="0 0 24 24" width="20" height="20">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 12-4.53z" fill="#EA4335"/>
          </svg>
          Google
        </button>
        <button class="social-btn social-btn--facebook">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="#1877F2">
            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
          </svg>
          Facebook
        </button>
      </div>

      <p class="auth-help">Bạn gặp khó khăn? <a href="#" class="auth-help-link">Trung tâm trợ giúp</a></p>
    </div>
  </main>

  <!-- FOOTER & CHATBOT -->
  <div id="footer-placeholder"></div>
  <div id="chatbot-placeholder"></div>

  <!-- ===== MODAL QUÊN MẬT KHẨU ===== -->
  <div class="modal-overlay" id="modalOverlay"></div>

  <div class="modal" id="modalForgotPassword">
    <div class="modal-content modal-content--forgot">
      <div class="modal-header">
        <h2 class="modal-title">Khôi phục mật khẩu</h2>
        <button class="modal-close" id="closeForgotModal">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="modal-body">
        <p class="modal-desc">Nhập email của bạn để nhận liên kết đặt lại mật khẩu.</p>
        <form id="forgotPasswordForm">
          <div class="form-group">
            <label class="form-label" for="resetEmail">Email</label>
            <input type="email" id="resetEmail" class="form-input" placeholder="example@gmail.com" required />
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="modal-btn modal-btn--cancel" id="cancelForgotBtn">Hủy</button>
        <button class="modal-btn modal-btn--primary" type="submit" form="forgotPasswordForm" id="submitForgotPassword">Gửi yêu cầu</button>
      </div>
    </div>
  </div>

  <!-- JS -->
  <script src="../js/main.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/header.js"></script>

  <!-- ===== FETCH HEADER / FOOTER ===== -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      fetch('../components/header.html')
        .then(res => res.text())
        .then(data => document.getElementById('header-placeholder').innerHTML = data)
        .catch(() => console.warn('Header not found'));

      fetch('../components/footer.html')
        .then(res => res.text())
        .then(data => document.getElementById('footer-placeholder').innerHTML = data)
        .catch(() => console.warn('Footer not found'));
    });
  </script>
  </body>
</html>
